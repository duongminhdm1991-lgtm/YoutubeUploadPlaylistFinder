<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Uploads Playlist Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #212121;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #3d3d3d;
            background-color: #121212;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #ff0000;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #result {
            margin-top: 24px;
            display: none;
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .loading {
            color: #aaaaaa;
            font-weight: 600;
        }
        .success {
            color: #4ade80;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .error {
            color: #ff4d4d;
            font-weight: 600;
        }
        .result-link {
            color: #3ea6ff;
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
            display: block;
            margin-top: 10px;
            padding: 10px;
            background: rgba(62, 166, 255, 0.1);
            border-radius: 6px;
        }
        .result-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Uploads Playlist Finder</h2>
        <input type="text" id="urlInput" placeholder="https://www.youtube.com/@ChannelName">
        <button id="actionBtn" onclick="findPlaylist()">Get Playlist</button>
        <div id="result"></div>
    </div>

    <script>
        async function findPlaylist() {
            const input = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('actionBtn');
            const resultDiv = document.getElementById('result');
            
            if (!input) return;

            btn.disabled = true;
            btn.innerText = "Working...";
            resultDiv.style.display = "block";
            resultDiv.innerHTML = "<div class='loading'>Scraping YouTube data...</div>";

            // Ensure valid URL
            const targetUrl = input.startsWith('http') ? input : `https://www.youtube.com/${input}`;

            // Proxies to bypass CORS since we are running in a browser
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
            ];

            let channelId = null;

            // Try each proxy until one succeeds
            for (const proxy of proxies) {
                try {
                    const response = await fetch(proxy);
                    if (!response.ok) continue;
                    
                    const html = await response.text();

                    // 1. Exact method from script.sh (og:url meta tag)
                    const match1 = html.match(/<meta property="og:url" content="https:\/\/www\.youtube\.com\/channel\/(UC[\w-]{22})">/i);
                    if (match1 && match1[1]) { channelId = match1[1]; break; }

                    // 2. JSON fallback
                    const match2 = html.match(/"channelId":"(UC[\w-]{22})"/);
                    if (match2 && match2[1]) { channelId = match2[1]; break; }
                    
                    // 3. RSS fallback
                    const match3 = html.match(/channel_id=(UC[\w-]{22})/);
                    if (match3 && match3[1]) { channelId = match3[1]; break; }

                } catch (e) {
                    // Fetch failed, silently try the next proxy
                    continue;
                }
            }

            if (channelId) {
                // Convert UC to UU for the uploads playlist
                const playlistId = 'UU' + channelId.substring(2);
                const playlistUrl = 'https://www.youtube.com/playlist?list=' + playlistId;
                
                resultDiv.innerHTML = `
                    <div class="success">Playlist Found!</div>
                    <a href="${playlistUrl}" target="_blank" class="result-link">${playlistUrl}</a>
                `;
            } else {
                resultDiv.innerHTML = `<div class="error">Failed to extract ID. YouTube is blocking the proxy servers.</div>`;
            }

            btn.disabled = false;
            btn.innerText = "Get Playlist";
        }

        // Allow pressing Enter in the input field
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                findPlaylist();
            }
        });
    </script>

</body>
</html>
